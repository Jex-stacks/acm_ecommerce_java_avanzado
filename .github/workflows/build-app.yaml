name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Construcción (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
        
      - name: Compilar
        run: ./gradlew build -x test

  # Job 2: Pruebas (Test)
  test:
    needs: build
    runs-on: ubuntu-latest
    
    # --- AGREGA TODO ESTE BLOQUE ---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5434:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    # -------------------------------
    
    steps:
      - uses: actions/checkout@v3
      # ... (el resto de tus pasos como configurar Java y permisos se quedan exactamente igual)
      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
        
      - name: Pruebas con Secretos
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: ./gradlew test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      # --- AGREGA ESTOS 3 PASOS NUEVOS ---
      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
        
      - name: Generar archivo .jar
        run: ./gradlew build -x test
      # -----------------------------------
      
      - name: Login en GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extraer Short-SHA (Etiquetado semántico)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        
      - name: Construir y Publicar Imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jex-stacks/ecommerce-app:latest
            ghcr.io/jex-stacks/ecommerce-app:${{ env.sha_short }}
            
      - name: Escaneo Trivy (Seguridad Integrada)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/jex-stacks/ecommerce-app:${{ env.sha_short }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' 